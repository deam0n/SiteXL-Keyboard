name: Build SiteXL Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Keep the debug signing certificate stable between CI runs so
      # users can install updates without uninstalling the previous APK.
      - name: Cache SiteXL debug signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/sitexl-debug.keystore
          key: sitexl-debug-keystore-v1

      - name: Create SiteXL debug signing key when cache is empty
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/sitexl-debug.keystore" ]; then
            keytool -genkeypair -noprompt -v \
              -keystore "$HOME/.android/sitexl-debug.keystore" \
              -storepass android \
              -alias sitexl-debug \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SiteXL Debug,O=SiteXL,C=LU"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate sync server Python syntax
        run: python -m py_compile server/app/main.py

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleDebugFix

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteXL-Keyboard-debug
          path: app/build/outputs/apk/debug/SiteXL_Keyboard_*-debug.apk

      - name: Upload side-by-side fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteXL-Keyboard-debugFix
          path: app/build/outputs/apk/debugFix/SiteXL_Keyboard_*-debugFix.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
